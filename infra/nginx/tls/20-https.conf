
# Port 80 for this name and no other, which is what confines the redirect to a
# provisioned host: the block the image ships stays the default server, so the
# Compose profile -- which is reached as localhost, never gets this file and has
# no certificate to redirect to -- keeps serving over plain HTTP.
#
# Without it the site answers on both schemes, and the plain one is not merely
# insecure: the session cookie is issued `Secure` because PUBLIC_ORIGIN is
# https, so a browser that reached the site over HTTP discards it and every
# sign-in appears to succeed and leaves the visitor signed out.
server {
  listen 80;
  listen [::]:80;
  server_name ${DOMAIN};

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ${DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_stapling on;
  ssl_stapling_verify on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 2m;

  include /etc/nginx/conf.d/api_locations;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/headers_params;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location = /theme.js {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/headers_params;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/conf.d/headers_params;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
