user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  server_tokens off;

  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/plain;

  upstream opencord_api {
    zone opencord_api 64k;
    server api-1:3000 resolve;
    server api-2:3000 resolve;
    keepalive 32;
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  include /etc/nginx/conf.d/*.conf;

  # Host-local server blocks, bind-mounted read-only by compose.prod.yaml and
  # absent everywhere else -- the image ships no such directory, and a glob that
  # matches nothing is not an error. scripts/provision-vps.sh renders
  # infra/nginx/tls/20-https.conf into it as 20-https.local.conf once a
  # certificate exists, which is how the same image serves plain HTTP under the
  # Compose profile and TLS in production.
  include /etc/nginx/extra/*.conf;
}
