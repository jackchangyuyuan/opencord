services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 250ms

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 250ms

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    environment:
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_REGION: "${AWS_REGION:?AWS_REGION is required}"
      RUSTFS_ACCESS_KEY: "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
      RUSTFS_SECRET_KEY: "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["rustfs-data:/data"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O- http://localhost:9000/health/ready || exit 1"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 250ms

  storage-init:
    image: amazon/aws-cli:2.36.40
    depends_on: { rustfs: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command: ["/scripts/init-storage.sh"]
    volumes: ["./scripts:/scripts:ro"]
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
      AWS_DEFAULT_REGION: "${AWS_REGION:?AWS_REGION is required}"
      S3_BUCKET: "${S3_BUCKET:?S3_BUCKET is required}"

volumes:
  postgres-data:
  rustfs-data:
